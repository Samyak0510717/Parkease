<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserve a slot — ParkEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="booking.css">
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo"><span class="mark">P</span>ParkEase</div>
    <a href="index.html" class="back-link">← Back to site</a>
  </div>
</header>

<div class="booking-shell">

  <!-- Selection view -->
  <div id="selectView">
    <div class="eyebrow">Reserve a slot</div>
    <h1>Where are you parking?</h1>
    <p class="lede">Pick a zone, choose a duration, and confirm — takes under a minute.</p>

    <div class="zone-grid" id="zoneGrid">
      <!-- populated by booking.js -->
    </div>

    <div class="duration-grid" id="durationGrid">
      <!-- populated by booking.js -->
    </div>

    <div class="pay-grid" id="payGrid">
      <button class="pay-card selected" data-method="khalti"><span class="sw" style="background:var(--khalti)"></span>Khalti</button>
      <button class="pay-card" data-method="esewa"><span class="sw" style="background:var(--esewa)"></span>eSewa</button>
      <button class="pay-card" data-method="cash"><span class="sw" style="background:#333"></span>Cash on arrival</button>
    </div>

    <div class="summary-card" id="summaryCard" style="display:none;">
      <div class="summary-row"><span>Zone</span><span id="sumZone">—</span></div>
      <div class="summary-row"><span>Duration</span><span id="sumDuration">—</span></div>
      <div class="summary-row"><span>Payment</span><span id="sumPayment">Khalti</span></div>
      <div class="summary-row total"><span>Total</span><span id="sumTotal">NPR 0</span></div>
    </div>

    <div class="status-banner error" id="errorBanner"></div>

    <button class="btn-primary" style="width:100%;" id="confirmBtn">Confirm booking →</button>
  </div>

  <!-- Confirmation view -->
  <div class="confirm-card" id="confirmView" style="display:none;">
    <div class="check">✓</div>
    <h2>Slot reserved</h2>
    <p id="confirmText">Show this token at entry. A confirmation was also sent by SMS.</p>
    <div class="token-box" id="tokenBox">—</div>
    <a href="index.html" class="btn-primary">Back to home</a>
  </div>

</div>

<script src="api.js"></script>
<script src="booking.js"></script>
</body>
</html>
